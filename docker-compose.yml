version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kovio-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kovio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kovio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kovio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kovio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - kovio-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: kovio-centrifugo
    ports:
      - "8000:8000"
    volumes:
      - ./centrifugo.json:/centrifugo/config.json
    command: centrifugo -c config.json
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kovio-network

  backend:
    build: .
    container_name: kovio-backend
    ports:
      - "8082:8082"
    environment:
      APP_ENV: development
      PORT: 8082
      JWT_SECRET: change_me_to_a_long_random_string
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: kovio
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_SECRET: change_me_centrifugo_hmac_secret
      CENTRIFUGO_API_KEY: change_me_centrifugo_api_key
      SEED_ADMIN_EMAIL: admin@kovio.local
      SEED_ADMIN_PASSWORD: KovioAdmin!2026
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_started
    networks:
      - kovio-network

volumes:
  postgres_data:
  redis_data:

networks:
  kovio-network:
    driver: bridge
